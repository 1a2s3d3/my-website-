<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excellent Musician.com</title>
  <link rel="icon" href="excellent.jpg" type="image/jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

  <style>
    body {
      background-image: url('Violin.jpg');
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Chewy', cursive;
      animation: bgFloat 30s ease-in-out infinite;
      color: #d0f0ff;
      background-color: #0a1a2f;
    }

    @keyframes bgFloat {
      0% { background-position: center top; }
      50% { background-position: center bottom; }
      100% { background-position: center top; }
    }

    .menu {
      background-color: #113a5c;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      border-bottom: 4px dashed #5edfff;
      animation: fadeInMenu 1.2s ease-in-out;
    }

    @keyframes fadeInMenu {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      gap: 40px;
    }

    .menu ul li {
      display: inline-block;
      font-size: 20px;
      font-weight: bold;
      padding: 10px 18px;
      transition: background 0.3s, transform 0.3s;
    }

    .menu ul li a {
      color: #aee8ff;
      text-decoration: none;
      font-weight: bold;
    }

    .menu ul li:hover {
      background-color: #1e5b82;
      border-radius: 12px;
      transform: scale(1.08);
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      background-color: rgba(15, 40, 60, 0.95);
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeInMain 1.5s ease;
    }

    @keyframes fadeInMain {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      text-align: center;
      font-size: 34px;
      color: #aee8ff;
      margin-bottom: 30px;
      text-shadow: 1px 1px #001f3f;
    }

    .levels {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 30px;
    }

    .level-option {
      background-color: #102e45;
      border: 3px dashed #5edfff;
      padding: 30px 20px;
      border-radius: 25px;
      width: 250px;
      text-align: center;
      color: #d0f0ff;
      font-size: 24px;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .level-option:hover {
      transform: scale(1.07);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      background-color: #1b4a6e;
    }

    .level-option:active {
      transform: scale(0.97);
    }

    @media screen and (max-width: 768px) {
      .menu {
        flex-direction: column;
        padding: 20px;
        height: auto;
      }

      .menu ul {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
        width: 100%;
      }

      .menu ul li {
        display: block;
        width: 100%;
      }

      .levels {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <div class="menu">
    <ul>
      <li><a href="new website.html">Home</a></li>
      <li><a href="category.html">Back</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </div>

  <div class="container">
    <h2 class="title">Select Your Skill Level 🎼</h2>
    <div class="levels">
      <div class="level-option" onclick="alert('Beginner level selected!')">
        🐣 Beginner
      </div>
      <div class="level-option" onclick="alert('Intermediate level selected!')">
        🎯 Intermediate
      </div>
      <div class="level-option" onclick="alert('Advanced level selected!')">
        🚀 Advanced
      </div>
    </div>
  </div>

</body>
</html>
